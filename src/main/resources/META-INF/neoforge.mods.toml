modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''
authors="${mod_authors}"

[[mixins]]
config="sporeadds.mixin.json"

[[dependencies.sporeadd]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.sporeadd]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.sporeadd]]
modId="spore"
type="required"
versionRange="[2.2.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.sporeadd]]
modId="pehkui"
type="required"
versionRange="[3.8.2,)"
ordering="NONE"
side="BOTH"

[[dependencies.sporeadd]]
modId="origins"
type="optional"
versionRange="[1.10.0,)"
ordering="NONE"
side="BOTH"
